[project]
name = "oscilab"
version = "0.2.0"
description = "Oscilloscope laboratory application"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "h5py>=3.11.0",
    "loguru>=0.7.3",
    "pydantic>=2.13.5",
    "pyqt6>=6.11.0",
    "pyqtgraph>=0.14.0",
    "scipy>=1.18.0",
]

[project.scripts]
oscilab = "oscilab.__main__:main"
oscilab-demo = "oscilab.demo:run"
# The showcases (oscilab.examples) and benchmarks (oscilab.benchmarks)
oscilab-xbox = "oscilab.examples.xbox:main"
oscilab-sensor-logger = "oscilab.examples.sensor_logger:main"
oscilab-udp = "oscilab.examples.udp:main"
oscilab-bench = "oscilab.benchmarks.refresh:main"

[tool.setuptools.packages.find]
where = ["src"]

# Not Python, so not in the wheel unless named: without them an installed
# Oscilab (not the editable install `uv run` uses) can't start
[tool.setuptools.package-data]
"oscilab.assets" = ["*.png", "*.qss"]

[tool.uv]
package = true
default-groups = ["dev", "bench"]  # So `uv run oscilab-bench` has its matplotlib

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.mypy]
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true  # tests/ is checked as the `tests` package
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
enable_error_code = ["ignore-without-code"]

# No type information published for these
[[tool.mypy.overrides]]
module = ["pyqtgraph", "pyqtgraph.*", "h5py"]
ignore_missing_imports = true

# PyQt6's stubs type menuBar(), addMenu(), addAction(), addToolBar(), ... as
# possibly returning None, which they never do here; the window and its
# parts (oscilab.ui) are made of such calls.
[[tool.mypy.overrides]]
module = ["oscilab.oscilab", "oscilab.ui.*"]
disable_error_code = ["union-attr"]

# Tests are checked for how they use the API, but needn't be annotated
# themselves; and they read the window's menus and toolbar (see above).
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disable_error_code = ["union-attr"]

[dependency-groups]
bench = [
    "matplotlib>=3.11.2",
]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "scipy-stubs>=1.18.1.1",
    "types-pyserial>=3.5.0.20260712",
]
docs = [
    "pdoc>=16.0.0",
]
