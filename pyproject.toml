[project]
name = "oscilab"
version = "0.2.0"
description = "Oscilloscope laboratory application"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "h5py>=3.11.0",
    "loguru>=0.7.3",
    "pydantic>=2.13.5",
    "pyqt6>=6.11.0",
    "pyqtgraph>=0.14.0",
    "scipy>=1.18.0",
]

[project.scripts]
oscilab-demo = "oscilab.demo:run"
oscilab = "oscilab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
