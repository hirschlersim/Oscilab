[project]
name = "oszilab"
version = "0.1.0"
description = "Oscilloscope laboratory application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "pyqt6>=6.11.0",
    "pyqtgraph>=0.14.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
oszilab_demo = "oszilab.demo:run"