version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Groups all updates into a single weekly pull request
    groups:
      python-dependencies:
        patterns:
          - "*"
  # Keeps the action versions in .github/workflows/ current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
