name: CI

on:
  push:
    branches: [main]
  pull_request: # includes Dependabot's update PRs
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR supersedes a still-running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      # --only-dev: ruff doesn't need PyQt6/scipy/h5py installed.
      - run: uv run --locked --only-dev ruff check --output-format=github
      - run: uv run --locked --only-dev ruff format --check

  types:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      # Not --only-dev: mypy reads the dependencies' own type information
      # (PyQt6, numpy, pydantic, ...). It only reads them, so Linux is fine.
      - run: uv run --locked mypy

  test:
    name: Pytest
    # Windows is the app's target platform, and PyQt6's wheels need no extra
    # system packages there (Linux would need libEGL, xkbcommon, ... for Qt).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run --locked coverage run -m pytest
      # What the tests leave out; under the floor (pyproject.toml) fails the job
      - run: uv run --locked coverage report
      # The total, for the README's coverage badge (see the pages job)
      - run: uv run --locked coverage json -o coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.json

  wheel:
    name: Wheel
    # What a fork or `pip install git+...` installs: a built wheel, not the
    # editable install `uv run` uses. Catches files left out of it (the icon
    # and style sheets were, once: the window couldn't open).
    runs-on: windows-latest
    timeout-minutes: 10 # A window that hangs instead of opening
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv build --wheel
      # The wheel and the locked dependencies, in a venv outside the source tree
      - shell: bash
        run: |
          uv export --locked --no-dev --no-default-groups --no-emit-project --no-hashes -o requirements.txt
          uv venv --python 3.12 ../wheel-env
          uv pip install --python ../wheel-env -r requirements.txt dist/*.whl
      - name: Open a window from it
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ../wheel-env/Scripts/python -I -c "
          from oscilab import Oscilab
          scope = Oscilab()
          scope.set_theme('light')  # Both style sheets
          assert not scope.windowIcon().isNull(), 'no icon.png'
          scope.close()
          "

  docs:
    name: API docs
    # pdoc imports oscilab, and so PyQt6 (see the test job on Linux)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv run --locked --group docs scripts/docs.py -o site
      # The HTML, under this run's Artifacts: download, open index.html
      - uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: site/

  pages:
    name: GitHub Pages
    # main's API docs, and its coverage for the README's badge, on
    # hirschlersim.github.io/Oscilab. Pages needs the repo public (and
    # Settings > Pages > Source: GitHub Actions): until then, it's skipped.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.repository.private
    needs: [test, docs]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api-docs
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: coverage
      # The badge, as shields.io's endpoint badges read it
      - run: |
          python3 - <<'EOF'
          import json
          percent = json.load(open("coverage.json"))["totals"]["percent_covered"]
          color = "brightgreen" if percent >= 90 else "yellow" if percent >= 75 else "red"
          badge = {"schemaVersion": 1, "label": "coverage", "message": f"{percent:.0f}%", "color": color}
          json.dump(badge, open("site/coverage.json", "w"))
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
